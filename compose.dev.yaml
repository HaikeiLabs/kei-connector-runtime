services:
  connector-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    # Report the installation heartbeat before serving so local setup can bind
    # the pending installation after the container is healthy.
    command: ["sh", "-c", "if [ -n \"$${KEI_RUNTIME_TOKEN:-}\" ]; then ./kei-proxy runtime bootstrap; fi; exec ./kei-proxy serve"]
    environment:
      ENV: ${ENV:-local}
      KEI_PROXY_LISTEN_ADDR: ${KEI_PROXY_LISTEN_ADDR:-0.0.0.0:8085}
      KEI_RUNTIME_CONTROL_PLANE_URL: ${KEI_RUNTIME_CONTROL_PLANE_URL:-http://host.docker.internal:8082}
      KEI_RUNTIME_TOKEN: ${KEI_RUNTIME_TOKEN:-}
      KEI_RUNTIME_VERSION: ${KEI_RUNTIME_VERSION:-local}
      KEI_PROXY_INVOKING_SUBJECT: ${KEI_PROXY_INVOKING_SUBJECT:-}
    ports:
      - "${KEI_PROXY_PORT:-8085}:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["openwebui"]
    environment:
      OPENAI_API_BASE_URL: http://connector-runtime:8085/v1
      OPENAI_API_KEY: ${KEI_RUNTIME_TOKEN:-}
      WEBUI_AUTH: ${OPENWEBUI_AUTH:-false}
      ENABLE_SIGNUP: ${OPENWEBUI_ENABLE_SIGNUP:-true}
    depends_on:
      connector-runtime:
        condition: service_healthy
    ports:
      - "${OPENWEBUI_PORT:-3001}:8080"
    volumes:
      - openwebui-data:/app/backend/data

volumes:
  openwebui-data:
