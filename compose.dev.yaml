services:
  ministack:
    image: ${MINISTACK_IMAGE:-ministackorg/ministack:1.5.14}
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      PERSIST_STATE: ${MINISTACK_PERSIST_STATE:-1}
      STATE_DIR: /data/state
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    volumes:
      - ministack-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4566/_ministack/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  connector-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    # Report the installation heartbeat before serving so local setup can bind
    # the pending installation after the container is healthy.
    entrypoint: ["/bin/sh", "-c"]
    command: ["if [ -n \"$${KEI_RUNTIME_TOKEN:-}\" ]; then ./kei-proxy runtime bootstrap; fi; exec ./kei-proxy serve"]
    environment:
      ENV: ${ENV:-local}
      KEI_PROXY_LISTEN_ADDR: ${KEI_PROXY_LISTEN_ADDR:-0.0.0.0:8085}
      KEI_RUNTIME_CONTROL_PLANE_URL: ${KEI_RUNTIME_CONTROL_PLANE_URL:-http://host.docker.internal:8082}
      KEI_RUNTIME_TOKEN: ${KEI_RUNTIME_TOKEN:-}
      KEI_RUNTIME_VERSION: ${KEI_RUNTIME_VERSION:-local}
      KEI_PROXY_INVOKING_SUBJECT: ${KEI_PROXY_INVOKING_SUBJECT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      KEI_AWS_SECRETS_MANAGER_ENDPOINT: ${KEI_AWS_SECRETS_MANAGER_ENDPOINT:-http://ministack:4566}
    ports:
      - "${KEI_PROXY_PORT:-8085}:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
    depends_on:
      ministack:
        condition: service_healthy

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["openwebui"]
    environment:
      OPENAI_API_BASE_URL: http://connector-runtime:8085/v1
      OPENAI_API_KEY: ${KEI_RUNTIME_TOKEN:-}
      WEBUI_AUTH: ${OPENWEBUI_AUTH:-false}
      ENABLE_SIGNUP: ${OPENWEBUI_ENABLE_SIGNUP:-true}
    depends_on:
      connector-runtime:
        condition: service_healthy
    ports:
      - "${OPENWEBUI_PORT:-3001}:8080"
    volumes:
      - openwebui-data:/app/backend/data

volumes:
  openwebui-data:
  ministack-data:
