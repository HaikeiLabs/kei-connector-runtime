# Static tool -> service registry (design §5.2).
# Tools mapped to a service get a credential lookup; empty/missing values are
# policy-only (authorized via ABAC, no credential lookup, never enrollment_required).
# Bare service names (github, wiki, ...) let clients pass the service name
# directly as the tool, matching how pedro-tag's KeiProxyClient calls authorize.
tools:
  github: github
  wiki: wiki
  notion: notion
  jira: jira
  github.list_pages: github
  github.create_pr: github
  github.read_repo: github
  github.read_issues: github
  github.read_prs: github
  github.list_prs: github
  notion.query: notion
  jira.create_issue: jira
  web_search: ""
