version: 2

project_name: kei-proxy

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

before:
  hooks:
    - ./scripts/verify-proxy-module.sh

builds:
  - id: kei-proxy
    dir: .
    main: .
    binary: kei-proxy
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    tags:
      - netgo

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else if eq .Os "linux" }}Linux
      {{- end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- end }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

signs:
  - id: checksum
    cmd: sh
    args:
      - '-c'
      - 'test -n "$GORELEASER_SKIP_SIGN" || gpg --batch --local-user "$GORELEASER_KEY" --detach-sign --armor --output "${artifact}.sig" "$artifact"'
    artifacts: checksum
    signature: "${artifact}.sig"

blobs:
  - provider: s3
    bucket: "{{ .Env.AWS_S3_RELEASES_BUCKET }}"
    region: "{{ .Env.AWS_S3_RELEASES_REGION }}"
    directory: "kei-proxy/{{ .Version }}"

release:
  # Proxy binaries are distributed from the shared S3 release bucket.
  disable: true

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github-native
