name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    # ubuntu-latest, not the self-hosted kei-eks-deploy pool: this suite needs
    # no AWS or cluster access, and a hosted runner avoids depending on the org
    # runner-group grant that new repositories do not receive by default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      # The connector contract is a released private module in a *different*
      # repository, so the public module proxy cannot serve it and Go must
      # authenticate to GitHub. GOPRIVATE also keeps it out of the public
      # checksum database.
      #
      # The default GITHUB_TOKEN cannot be used: it is scoped to this repository
      # alone, so fetching a private sibling fails with
      # "remote: Repository not found" rather than a permission error.
      #
      # Two credentials are supported, in order of preference:
      #
      #   1. A GitHub App installation token, minted per run from APP_ID and
      #      APP_PRIVATE_KEY. The token is short-lived and scoped to the single
      #      repository requested below, so nothing long-lived is stored here.
      #      This is the preferred option; the organization already runs a
      #      GitHub App for the Actions runner scale sets.
      #   2. MODULE_READ_TOKEN, a PAT with contents:read on the contract
      #      repository, as a fallback where an App is not configured. Prefer a
      #      fine-grained PAT limited to that one repository: a classic PAT
      #      carries the whole account's access.
      - name: Mint a GitHub App token
        id: app_token
        # Skipped rather than failed when the App is not configured, so the PAT
        # fallback below can still run.
        if: ${{ vars.MODULE_READ_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MODULE_READ_APP_ID }}
          private-key: ${{ secrets.MODULE_READ_APP_PRIVATE_KEY }}
          owner: HaikeiLabs
          repositories: kei-connector-contracts

      - name: Authenticate for private modules
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          MODULE_READ_TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
        run: |
          TOKEN="${APP_TOKEN:-${MODULE_READ_TOKEN}}"
          if [ -z "${TOKEN}" ]; then
            echo "::error::No credential available for the private connector-contract module."
            echo "Go cannot fetch github.com/HaikeiLabs/kei-connector-contracts:"
            echo "the default GITHUB_TOKEN grants access only to this repository."
            echo
            echo "Configure either:"
            echo "  - MODULE_READ_APP_ID (variable) and MODULE_READ_APP_PRIVATE_KEY"
            echo "    (secret) for a per-run GitHub App token, or"
            echo "  - MODULE_READ_TOKEN (secret), a PAT with contents:read on that"
            echo "    repository."
            exit 1
          fi
          if [ -n "${APP_TOKEN}" ]; then
            echo "Using a GitHub App installation token (expires with this run)."
          else
            echo "Using MODULE_READ_TOKEN. A GitHub App token is preferred: it is"
            echo "short-lived and scoped to one repository."
          fi
          # The token is masked by Actions, but write it through git config
          # rather than the environment so it is not inherited by the toolchain.
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/HaikeiLabs/*" >> "$GITHUB_ENV"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # No database service: this suite is in-process and never reads
      # DATABASE_URL, so unlike the policy catalog it cannot pass by skipping.
      - name: Test
        run: go test -count=1 -race ./...

      - name: Binary name compatibility
        # ADR-017 §4: Kei-Chat-Harness resolves this binary through
        # KEI_PROXY_PATH and kei-cli through exec.LookPath("kei-proxy") with a
        # /tmp/kei-proxy fallback. The release artifact is published under the
        # kei-proxy/ S3 prefix. Renaming the binary breaks those consumers, so
        # the name is asserted rather than left to a later edit.
        run: |
          go build -o kei-proxy .
          test -x ./kei-proxy || { echo "kei-proxy binary was not produced"; exit 1; }
          ./kei-proxy version
          rm -f kei-proxy

      - name: No build artifacts committed
        # A 17MB binary was committed to the kei monorepo because the ignore
        # list did not cover its name. Fail loudly rather than grow the history.
        run: |
          large=$(git ls-files | xargs -I{} sh -c 'test -f "{}" && find "{}" -size +2M' 2>/dev/null || true)
          if [ -n "$large" ]; then
            echo "Tracked files larger than 2MB:"
            echo "$large"
            exit 1
          fi
          echo "OK: no oversized tracked files"
