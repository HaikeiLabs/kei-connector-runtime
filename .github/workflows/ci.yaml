name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: kei-cli-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # No database service: this suite is in-process and never reads
      # DATABASE_URL, so unlike the policy catalog it cannot pass by skipping.
      - name: Test
        run: go test -count=1 -race ./...

      - name: Binary name compatibility
        # ADR-017 §4: kei-chat-harness resolves this binary through
        # KEI_PROXY_PATH and kei-cli through exec.LookPath("kei-proxy") with a
        # /tmp/kei-proxy fallback. The release artifact is published under the
        # kei-proxy/ S3 prefix. Renaming the binary breaks those consumers, so
        # the name is asserted rather than left to a later edit.
        run: |
          go build -o kei-proxy ./cmd/kei-proxy
          test -x ./kei-proxy || { echo "kei-proxy binary was not produced"; exit 1; }
          ./kei-proxy version
          rm -f kei-proxy

      - name: No build artifacts committed
        # A 17MB binary was committed to the kei monorepo because the ignore
        # list did not cover its name. Fail loudly rather than grow the history.
        run: |
          large=$(git ls-files | xargs -I{} sh -c 'test -f "{}" && find "{}" -size +2M' 2>/dev/null || true)
          if [ -n "$large" ]; then
            echo "Tracked files larger than 2MB:"
            echo "$large"
            exit 1
          fi
          echo "OK: no oversized tracked files"

      - name: Static guard – no policy/group write routes or default permit
        # ADR-026 Stack B1: the runtime must never contain a code path that
        # writes policies or groups or returns a default permit. Keep this guard
        # even after later stacks add bundle loading so the boundary stays
        # explicit between the runtime and the policy catalog.
        # pkg/harness/ is excluded because it compares bundle decision values
        # against the "permit" keyword (e.g. p.Action == "permit") — these are
        # legitimate policy decision comparisons, not default-permit code paths.
        run: |
          matches=$(git grep -lE \
            '(POST|PUT|PATCH|DELETE).*(policies|groups)|["'"'"']permit["'"'"']' \
            -- '*.go' ':(exclude)*_test.go' ':(exclude)pkg/harness/*' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "ADR-026 B1 violation: found policy/group write routes or default permit in production code"
            echo "$matches"
            exit 1
          fi
          echo "OK: no ADR-026 B1 violations"

  docker-runtime:
    name: Same-container runtime smoke test
    # kei-docker-ci is a dedicated no-AWS rootless-DinD runner (kei PR #650).
    # It has no EKS or AWS access — the smoke must not need cluster creds.
    runs-on: kei-docker-ci
    env:
      # The daemon is shared across jobs, so every resource is run-unique.
      SMOKE_IMAGE: kei-connector-runtime:ci-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_CONTAINER: kei-proxy-runtime-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_NETWORK: kei-proxy-runtime-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_VOLUME: kei-proxy-runtime-socket-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Docker daemon
        run: |
          attempt=0
          while [ "$attempt" -lt 30 ]; do
            if docker info >/dev/null 2>&1; then exit 0; fi
            attempt=$((attempt + 1))
            sleep 2
          done
          echo "Docker daemon did not become ready"
          exit 1

      - name: Build and run packaged daemon
        run: |
          docker build -t "$SMOKE_IMAGE" .
          docker network create "$SMOKE_NETWORK"
          docker volume create "$SMOKE_VOLUME"
          docker run -d --name "$SMOKE_CONTAINER" \
            --network "$SMOKE_NETWORK" \
            -v "$SMOKE_VOLUME:/run/kei-proxy" \
            -e KEI_RUNTIME_TOKEN=kh_live_ci_smoke_token_12345678901234567890 \
            -e KEI_RUNTIME_CONTROL_PLANE_URL=http://127.0.0.1:1 \
            --entrypoint /bin/sh \
            "$SMOKE_IMAGE" -c './kei-proxy serve & echo $! >/tmp/kei-proxy.pid; wait $!; sleep 60'
          attempt=0
          while [ "$attempt" -lt 30 ]; do
            if docker exec "$SMOKE_CONTAINER" wget -qO- http://127.0.0.1:8085/readyz >/dev/null 2>&1; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 1
          done
          docker exec "$SMOKE_CONTAINER" wget -qO- http://127.0.0.1:8085/readyz
          docker exec "$SMOKE_CONTAINER" sh -c 'test -S /run/kei-proxy/runtime.sock && test "$(stat -c %a /run/kei-proxy/runtime.sock)" = 600'
          # A sidecar harness shares only the socket volume: no network at all.
          docker run --rm --network none --user 0 -v "$SMOKE_VOLUME:/run/kei-proxy" \
            curlimages/curl:8.10.1 -fsS --unix-socket /run/kei-proxy/runtime.sock http://localhost/readyz
          # The socket is owner-only, so a harness running as another UID is refused.
          if docker run --rm --network none --user 100 -v "$SMOKE_VOLUME:/run/kei-proxy" \
            curlimages/curl:8.10.1 -fsS --unix-socket /run/kei-proxy/runtime.sock http://localhost/readyz; then
            echo "socket accepted a connection from a different UID"
            exit 1
          fi
          docker exec "$SMOKE_CONTAINER" sh -c 'kill -TERM "$(cat /tmp/kei-proxy.pid)"'
          attempt=0
          while [ "$attempt" -lt 15 ]; do
            if ! docker exec "$SMOKE_CONTAINER" test -S /run/kei-proxy/runtime.sock; then exit 0; fi
            attempt=$((attempt + 1))
            sleep 1
          done
          echo "runtime did not remove socket after SIGTERM"
          exit 1

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker exec "$SMOKE_CONTAINER" sh -c 'rm -f /run/kei-proxy/runtime.sock' >/dev/null 2>&1 || true
          docker rm -f "$SMOKE_CONTAINER" >/dev/null 2>&1 || true
          docker volume rm "$SMOKE_VOLUME" >/dev/null 2>&1 || true
          docker network rm "$SMOKE_NETWORK" >/dev/null 2>&1 || true
          docker image rm "$SMOKE_IMAGE" >/dev/null 2>&1 || true
