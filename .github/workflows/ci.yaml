name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    # ubuntu-latest, not the self-hosted kei-eks-deploy pool: this suite needs
    # no AWS or cluster access, and a hosted runner avoids depending on the org
    # runner-group grant that new repositories do not receive by default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      # The connector contract is a released private module in a *different*
      # repository, so the public module proxy cannot serve it and Go must
      # authenticate to GitHub. GOPRIVATE also keeps it out of the public
      # checksum database.
      #
      # The default GITHUB_TOKEN is not sufficient: it is scoped to this
      # repository alone, so fetching a private sibling fails with
      # "remote: Repository not found" rather than a permission error.
      # MODULE_READ_TOKEN must be an org-scoped secret (PAT or GitHub App token)
      # with contents:read on HaikeiLabs/kei-connector-contracts.
      - name: Authenticate for private modules
        env:
          MODULE_READ_TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
        run: |
          if [ -z "${MODULE_READ_TOKEN}" ]; then
            echo "::error::MODULE_READ_TOKEN is not set."
            echo "Go cannot fetch github.com/HaikeiLabs/kei-connector-contracts without it:"
            echo "the default GITHUB_TOKEN grants access only to this repository."
            echo "Add an org-scoped secret with contents:read on that repository."
            exit 1
          fi
          git config --global url."https://x-access-token:${MODULE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/HaikeiLabs/*" >> "$GITHUB_ENV"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # No database service: this suite is in-process and never reads
      # DATABASE_URL, so unlike the policy catalog it cannot pass by skipping.
      - name: Test
        run: go test -count=1 -race ./...

      - name: Binary name compatibility
        # ADR-017 §4: Kei-Chat-Harness resolves this binary through
        # KEI_PROXY_PATH and kei-cli through exec.LookPath("kei-proxy") with a
        # /tmp/kei-proxy fallback. The release artifact is published under the
        # kei-proxy/ S3 prefix. Renaming the binary breaks those consumers, so
        # the name is asserted rather than left to a later edit.
        run: |
          go build -o kei-proxy .
          test -x ./kei-proxy || { echo "kei-proxy binary was not produced"; exit 1; }
          ./kei-proxy version
          rm -f kei-proxy

      - name: No build artifacts committed
        # A 17MB binary was committed to the kei monorepo because the ignore
        # list did not cover its name. Fail loudly rather than grow the history.
        run: |
          large=$(git ls-files | xargs -I{} sh -c 'test -f "{}" && find "{}" -size +2M' 2>/dev/null || true)
          if [ -n "$large" ]; then
            echo "Tracked files larger than 2MB:"
            echo "$large"
            exit 1
          fi
          echo "OK: no oversized tracked files"
